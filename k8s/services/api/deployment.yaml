apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: monolith
    app.kubernetes.io/part-of: oficina-mecanica
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: monolith
        app.kubernetes.io/part-of: oficina-mecanica
        app.kubernetes.io/version: "1.0.0"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      volumes:
        - name: newrelic-instrumentation
          emptyDir: {}
      initContainers:
        # Copia o agente .NET do New Relic para o volume compartilhado abaixo.
        # Injeta instrumentação sem precisar builda-la na imagem da API
        # (o Dockerfile do oficina-mecanica não instala nenhum agente).
        - name: newrelic-agent-init
          image: newrelic/newrelic-dotnet-init:10.54.0.0
          # A imagem só empacota os arquivos do agente em /instrumentation;
          # não copia sozinha, precisa mandar o comando explicitamente. O
          # chown é necessário porque o container da API roda como appuser
          # (999:999, não-root) e precisa escrever o log do agente ali dentro.
          command: ["sh", "-c", "cp -a /instrumentation/. /newrelic-instrumentation/ && chown -R 999:999 /newrelic-instrumentation"]
          volumeMounts:
            - name: newrelic-instrumentation
              mountPath: /newrelic-instrumentation
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: api
          # Imagem publicada automaticamente pelo ci.yml do oficina-mecanica a cada
          # merge em main. O pacote no GHCR é privado, por isso o imagePullSecrets
          # acima (criado por scripts/create-ghcr-pull-secret.sh).
          image: ghcr.io/tech-challenge-oficina-mecanica-soat/oficina-mecanica-api:latest
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: newrelic-instrumentation
              mountPath: /newrelic-instrumentation
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secrets
          env:
            # Instrumentação APM do New Relic via profiler .NET (CLR Profiling API).
            # Se NEW_RELIC_LICENSE_KEY vier vazio (Secret sem valor), o agente
            # carrega mas não reporta nada; não impede a API de rodar normalmente.
            - name: CORECLR_ENABLE_PROFILING
              value: "1"
            - name: CORECLR_PROFILER
              value: "{36032161-FFC0-4B61-B559-F6C5D41BAE5A}"
            - name: CORECLR_PROFILER_PATH
              value: /newrelic-instrumentation/libNewRelicProfiler.so
            - name: CORECLR_NEWRELIC_HOME
              value: /newrelic-instrumentation
          # Testado de ponta a ponta em 2026-09-05 (correção do Redis__ConnectionString
          # no configmap.yaml): pod chega em 1/1 Running sem nenhum ajuste manual,
          # /health, /health/live e /health/ready respondem 200 via NLB.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
