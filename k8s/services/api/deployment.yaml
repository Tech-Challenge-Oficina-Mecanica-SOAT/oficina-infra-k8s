apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: monolith
    app.kubernetes.io/part-of: oficina-mecanica
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: monolith
        app.kubernetes.io/part-of: oficina-mecanica
        app.kubernetes.io/version: "1.0.0"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          # Imagem publicada automaticamente pelo ci.yml do oficina-mecanica a cada
          # merge em main. O pacote no GHCR é privado, por isso o imagePullSecrets
          # acima (criado por scripts/create-ghcr-pull-secret.sh).
          image: ghcr.io/tech-challenge-oficina-mecanica-soat/oficina-mecanica-api:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
