apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: monolith
    app.kubernetes.io/part-of: oficina-mecanica
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: monolith
        app.kubernetes.io/part-of: oficina-mecanica
        app.kubernetes.io/version: "1.0.0"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          # Imagem publicada automaticamente pelo ci.yml do oficina-mecanica a cada
          # merge em main. O pacote no GHCR é privado, por isso o imagePullSecrets
          # acima (criado por scripts/create-ghcr-pull-secret.sh).
          image: ghcr.io/tech-challenge-oficina-mecanica-soat/oficina-mecanica-api:latest
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secrets
          # /health/live e /health/ready foram adicionados no PR #44 do
          # oficina-mecanica, mergeado em main em 2026-09-04. A imagem
          # publicada em `latest` já deve ter os dois endpoints, então o
          # patch abaixo não deveria ser mais necessário (ainda não
          # reconfirmado com um deploy novo). Se o pod cair em
          # CrashLoopBackOff com probe 404 de novo, é sinal de que a imagem
          # em `latest` regrediu ou não foi republicada; contorno enquanto
          # isso não for investigado:
          #   kubectl patch deployment oficina-api -n oficina --type='json' -p='[
          #     {"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe/httpGet/path","value":"/health"},
          #     {"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/path","value":"/health"}
          #   ]'
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
