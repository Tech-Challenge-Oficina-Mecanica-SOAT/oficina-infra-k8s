apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: monolith
    app.kubernetes.io/part-of: oficina-mecanica
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    # O cluster só tem 1 node (custo), mas o NLB usa as 2 subnets públicas
    # (2 AZs). Sem isso, metade do tráfego (a AZ sem node) cai em timeout/503
    # (cross-zone load balancing vem desligado por padrão em NLB).
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 80
      targetPort: 5000
      name: http
