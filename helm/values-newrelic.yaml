# licenseKey e cluster são sobrescritos via --set pelo scripts/install-newrelic.sh
# (licenseKey nunca deve ser commitado; o placeholder aqui existe só para documentar
# a chave que o script espera receber via variável de ambiente).
global:
  licenseKey: "PLACEHOLDER_SUBSTITUIR_VIA_SCRIPT"
  cluster: "oficina-eks-homolog"

newrelic-infrastructure:
  enabled: true
  privileged: true

# Desligado: já instrumentamos a API manualmente via init container
# (k8s/services/api/deployment.yaml, PR #12), então o webhook de injeção
# automática do agente APM é redundante aqui. Também evita gastar 2 dos
# poucos pods disponíveis no node t3.small (limite de 11 pods/node).
nri-metadata-injection:
  enabled: false

nri-kube-events:
  enabled: true

newrelic-logging:
  enabled: true
